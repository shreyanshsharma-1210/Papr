[build]
  command = "npm run build"
  publish = "dist/client"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob: chrome-extension:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https: blob: chrome-extension:; style-src 'self' 'unsafe-inline' https:; img-src 'self' https: data: blob:; font-src 'self' https: data:; connect-src 'self' https: wss:;"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
